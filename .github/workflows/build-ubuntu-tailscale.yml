name: Build Ubuntu Tailscale image

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if nothing changed
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tailscale-ubuntu
  BASE: ubuntu:latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve versions
        id: v
        shell: bash
        run: |
          tag="$(curl --fail --silent --show-error https://api.github.com/repos/tailscale/tailscale/releases/latest | jq -r '.tag_name')"
          if [[ -z "$tag" || "$tag" == "null" ]]; then
            echo "Failed to determine the latest Tailscale release tag" >&2
            exit 1
          fi
          docker pull "$BASE" >/dev/null
          digest="$(docker image inspect "$BASE" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)"
          ubuntu="$(docker run --rm "$BASE" sh -c '. /etc/os-release && echo "$PRETTY_NAME"')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "ubuntu=$ubuntu" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether a rebuild is needed
        id: check
        shell: bash
        run: |
          build=true
          if [[ "${{ inputs.force }}" != "true" ]]; then
            ann="$(docker buildx imagetools inspect "$IMAGE:latest" --raw 2>/dev/null | jq -r '.annotations // {}' 2>/dev/null || true)"
            cur_ver="$(jq -r '.["org.opencontainers.image.version"] // empty' <<<"$ann" 2>/dev/null || true)"
            cur_base="$(jq -r '.["org.opencontainers.image.base.digest"] // empty' <<<"$ann" 2>/dev/null || true)"
            if [[ "$cur_ver" == "${{ steps.v.outputs.tag }}" && "$cur_base" == "${{ steps.v.outputs.digest }}" ]]; then
              build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Check out Tailscale
        if: steps.check.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          repository: tailscale/tailscale
          ref: ${{ steps.v.outputs.tag }}
          fetch-depth: 1

      - name: Build and push image (official Tailscale build script)
        if: steps.check.outputs.build == 'true'
        shell: bash
        env:
          PUSH: 'true'
          REPOS: ${{ env.IMAGE }}
          BASE: ${{ env.BASE }}
          TAGS: latest,${{ steps.v.outputs.tag }}
          ANNOTATIONS: org.opencontainers.image.source=https://github.com/${{ github.repository }},org.opencontainers.image.description=Tailscale on Ubuntu,org.opencontainers.image.version=${{ steps.v.outputs.tag }},org.opencontainers.image.base.digest=${{ steps.v.outputs.digest }}
        run: ./build_docker.sh

      - name: Summary
        shell: bash
        run: |
          {
            if [[ "${{ steps.check.outputs.build }}" == "true" ]]; then
              echo "### Image published"
              echo "- Image: \`$IMAGE\`"
              echo "- Tags: \`latest\`, \`${{ steps.v.outputs.tag }}\`"
            else
              echo "### Skipped: image is already up to date"
            fi
            echo "- Tailscale: \`${{ steps.v.outputs.tag }}\`"
            echo "- Ubuntu base: ${{ steps.v.outputs.ubuntu }} (\`${{ steps.v.outputs.digest }}\`)"
          } >> "$GITHUB_STEP_SUMMARY"