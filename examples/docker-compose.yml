# Example: Tailscale (Ubuntu-based image) as a sidecar for another container.
# nginx shares the Tailscale network namespace, so it is reachable on your
# tailnet as http://tailscale-nginx (no ports published on the host).
#
# Usage:
#   1. cp .env.example .env   and put your auth key in .env
#   2. docker compose up -d
services:
  tailscale:
    image: ghcr.io/patrickwolf/tailscale-ubuntu:latest
    container_name: tailscale
    hostname: tailscale-nginx
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - ./tailscale-state:/var/lib/tailscale
    cap_add:
      - net_admin
      - net_raw
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx_server
    network_mode: service:tailscale
    depends_on:
      - tailscale
    restart: unless-stopped