# Example: a persistent Ubuntu-based Tailscale container.
# It joins your tailnet as "tailscale-ubuntu". Your home directory (/root) and
# the Tailscale state live in named volumes, so they survive container recreation.
#
# Usage:
#   1. cp .env.example .env   and put your auth key in .env
#   2. docker compose up -d
#   3. docker exec -it tailscale-ubuntu bash
#
# Pick ONE of the two image options below.
services:
  tailscale:
    # Option A: use the published image as-is
    image: ghcr.io/patrickwolf/tailscale-ubuntu:latest
    # Option B: build your own image with extra software (see Dockerfile).
    # Comment out the "image:" line above and uncomment these lines:
    # build: .
    # image: my-tailscale-ubuntu
    container_name: tailscale-ubuntu
    hostname: tailscale-ubuntu
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - tailscale-state:/var/lib/tailscale
      - home:/root
    cap_add:
      - net_admin
      - net_raw
    restart: unless-stopped

volumes:
  tailscale-state:
  home: