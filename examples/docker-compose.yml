# Example: a single Ubuntu-based Tailscale container.
# It joins your tailnet as "tailscale-ubuntu" and you can open a shell in it
# to install and run whatever you need.
#
# Usage:
#   1. cp .env.example .env   and put your auth key in .env
#   2. docker compose up -d
#   3. docker exec -it tailscale-ubuntu bash
services:
  tailscale:
    image: ghcr.io/patrickwolf/tailscale-ubuntu:latest
    container_name: tailscale-ubuntu
    hostname: tailscale-ubuntu
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - ./tailscale-state:/var/lib/tailscale
    cap_add:
      - net_admin
      - net_raw
    restart: unless-stopped